@if (loading) {
  <div class="vt-loading" style="padding:8rem 0">
    <div class="vt-loading-dots"><span></span><span></span><span></span></div>
  </div>
} @else if (error || !post) {
  <div class="vt-page-header"><div class="container"><h1>{{ t('notFound') }}</h1></div></div>
  <div class="container vt-section-sm" style="text-align:center">
    <a class="vt-btn vt-btn-outline" routerLink="/blog">{{ t('blog.back') }}</a>
  </div>
} @else {

  @if (post.cover_image) {
    <div class="vt-post-cover">
      <img [src]="post.cover_image" [alt]="post.title">
    </div>
  }

  <section class="vt-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <a routerLink="/blog" class="vt-back-link">{{ t('blog.back') }}</a>

          @if (post.published_at) {
            <p class="vt-post-date">{{ formatDate(post.published_at) }}</p>
          }

          <h1 class="vt-post-title">{{ post.title }}</h1>

          @if (post.subtitle) {
            <p class="vt-post-subtitle">{{ post.subtitle }}</p>
          }

          <div class="vt-body-content" [innerHTML]="post.body"></div>
        </div>
      </div>
    </div>
  </section>
}
